services:

  postgres:
    container_name: dev_fast_healthchecks_postgres
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    container_name: dev_fast_healthchecks_redis
    image: ${REDIS_IMAGE:-redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: on-failure
    ports: ['${REDIS_PORT:-6379}:6379']
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  rabbitmq:
    container_name: dev_fast_healthchecks_rabbitmq
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.4-alpine@sha256:a762c02d0c1fa7c3de1eca5d62b4fe9812649f41a3b38d716e1afcbe7e5387ad}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: always
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  zookeeper:
    container_name: dev_fast_healthchecks_zookeeper
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.9.2@sha256:c03f6fe4af97d57c42518b8deaf2753ed338ee414812f258f9cf32c977fe0a53}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    hostname: zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Confluent image only enables "srvr" four-letter word, not "ruok"
      test: ['CMD-SHELL', 'echo srvr | nc -w 2 localhost 2181 | grep -q Mode']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka1:
    container_name: dev_fast_healthchecks_kafka1
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.9.2@sha256:ecd1ce3c902fb5cfa7fc34881215f1a3e1abdcba5d0d9bbe6b0385ff6425e05c}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    hostname: kafka1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA1_PORT:-9094}:${KAFKA1_PORT:-9094}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,OUTSIDE://localhost:${KAFKA1_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1']
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka2:
    container_name: dev_fast_healthchecks_kafka2
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.9.2@sha256:ecd1ce3c902fb5cfa7fc34881215f1a3e1abdcba5d0d9bbe6b0385ff6425e05c}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    hostname: kafka2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA2_PORT:-9095}:${KAFKA2_PORT:-9095}"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,OUTSIDE://localhost:${KAFKA2_PORT:-9095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9093 || exit 1']
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  mongo:
    container_name: dev_fast_healthchecks_mongo
    image: ${MONGO_IMAGE:-mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  opensearch:
    container_name: dev_fast_healthchecks_opensearch
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      - discovery.type=single-node # Single node discovery
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM
      - "DISABLE_INSTALL_DEMO_CONFIG=true" # Prevents execution of bundled demo script which installs demo certificates and security configurations to OpenSearch
      - "DISABLE_SECURITY_PLUGIN=true" # Disables Security plugin
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200" # REST API
      - "${OPENSEARCH_PERFORMANCE_PORT:-9600}:9600" # Performance Analyzer
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
