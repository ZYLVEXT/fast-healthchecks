name: Release

on:
  workflow_dispatch:
    inputs:
      tests_run_id:
        description: Successful tag-bound Tests workflow run ID
        required: true
        type: string

permissions: {}

env:
  UV_CACHE_VERSION: v1

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Verify release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    outputs:
      is_tag: ${{ steps.tag.outputs.is_tag }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag and successful Tests run
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          TESTS_RUN_ID: ${{ inputs.tests_run_id }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/tags/* ]] || [[ ! "$TESTS_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Release requires an immutable tag and numeric Tests run ID." >&2
            exit 1
          fi
          mapfile -t tags < <(git tag --points-at HEAD)
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "Expected exactly one tag on the tested commit, found: ${tags[*]}" >&2
            exit 1
          fi
          TAG="${tags[0]}"
          VERSION=$(python scripts/release_artifacts.py version)
          if [ "$RELEASE_REF" != "refs/tags/$TAG" ] || [ "$TAG" != "$VERSION" ]; then
            echo "Release ref, tag, and project version do not agree." >&2
            exit 1
          fi
          if [ "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "GitHub release $TAG is missing or is not a draft." >&2
            exit 1
          fi
          bump_run_count=$(gh api "repos/$GH_REPO/actions/workflows/2_bump.yml/runs?branch=$DEFAULT_BRANCH&event=workflow_dispatch&status=success&head_sha=$RELEASE_SHA&per_page=1" --jq '.total_count')
          if [ "$bump_run_count" -lt 1 ]; then
            echo "No protected release-operations run proves this exact commit." >&2
            exit 1
          fi
          # The run is bound to this exact commit and tag below (head_sha, head_branch,
          # workflow_id, success); any successful run proving this SHA is acceptable,
          # so no "latest run" requirement — that would only add flake sensitivity.
          tests_workflow_id=$(gh api "repos/$GH_REPO/actions/workflows/1_test.yml" --jq .id)
          test_run=$(gh api "repos/$GH_REPO/actions/runs/$TESTS_RUN_ID")
          if ! jq -e --arg sha "$RELEASE_SHA" --arg tag "$TAG" --argjson workflow_id "$tests_workflow_id" \
            '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .head_sha == $sha and .head_branch == $tag and .workflow_id == $workflow_id' \
            <<< "$test_run" >/dev/null; then
            echo "Tests run $TESTS_RUN_ID does not prove this exact tagged commit." >&2
            exit 1
          fi
          draft_output=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .tag_name')
          drafts=()
          if [ -n "$draft_output" ]; then mapfile -t drafts <<< "$draft_output"; fi
          if [ "${#drafts[@]}" -ne 1 ] || [ "${drafts[0]}" != "$TAG" ]; then
            echo "Expected $TAG to be the only draft release, found: ${drafts[*]}" >&2
            exit 1
          fi
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  reproducible-build:
    name: Reproducible build and provenance
    needs: [check-tag]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ${{ env.UV_CACHE_VERSION }}
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build twice from the lockfile
        env:
          DIST1: ${{ runner.temp }}/dist1
          DIST2: ${{ runner.temp }}/dist2
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST1"
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST2"
          uv run --no-sync python scripts/release_artifacts.py compare --first "$DIST1" --second "$DIST2"
          uv run --no-sync python scripts/release_artifacts.py smoke --dist-dir "$DIST1"

      - name: Generate deterministic CycloneDX SBOM
        env:
          SBOM_CHECK_DIR: ${{ runner.temp }}/sbom-check
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          set -euo pipefail
          mkdir -p "$SBOM_DIR" "$SBOM_CHECK_DIR"
          VERSION=$(python scripts/release_artifacts.py version)
          serial_number=$(python -c 'import sys; from uuid import NAMESPACE_URL, uuid5; print(f"urn:uuid:{uuid5(NAMESPACE_URL, sys.argv[1])}")' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION#fast-healthchecks")
          timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          for output_dir in "$SBOM_DIR" "$SBOM_CHECK_DIR"; do
            raw=$(mktemp)
            uv export --preview-features sbom-export --frozen --all-extras --no-default-groups --format cyclonedx1.5 --output-file "$raw"
            jq -cS --arg serial_number "$serial_number" --arg timestamp "$timestamp" \
              '."$schema" = "https://cyclonedx.org/schema/bom-1.7.schema.json" | .specVersion = "1.7" | .serialNumber = $serial_number | .metadata.timestamp = $timestamp' \
              "$raw" > "$output_dir/fast-healthchecks-$VERSION.cdx.json"
          done
          jq -e --arg name "fast-healthchecks" --arg version "$VERSION" \
            '.bomFormat == "CycloneDX" and .specVersion == "1.7" and .metadata.component.name == $name and .metadata.component.version == $version' \
            "$SBOM_DIR/fast-healthchecks-$VERSION.cdx.json" >/dev/null
          cmp "$SBOM_DIR/fast-healthchecks-$VERSION.cdx.json" "$SBOM_CHECK_DIR/fast-healthchecks-$VERSION.cdx.json"

      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/*.whl
            ${{ runner.temp }}/dist1/*.tar.gz

      - name: Attest distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/*.whl
            ${{ runner.temp }}/dist1/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/fast-healthchecks-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist1/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/

  release-assets:
    name: Attach verified release assets
    needs: [check-tag, reproducible-build]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Upload assets without replacing mismatched files
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(dist/*.whl dist/*.tar.gz sbom/*.cdx.json)
          release_json=$(gh release view "$TAG" --repo "$GH_REPO" --json assets)
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            remote_digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "")' <<< "$release_json")
            if [ -z "$remote_digest" ]; then
              gh release upload "$TAG" "$asset" --repo "$GH_REPO"
            else
              local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              if [ "$remote_digest" != "$local_digest" ]; then
                echo "Release asset $name already exists with a different digest." >&2
                exit 1
              fi
            fi
          done

  pypi:
    name: Publish to PyPI
    needs: [check-tag, reproducible-build, release-assets]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/fast-healthchecks
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  docs:
    name: Deploy documentation
    needs: [check-tag, pypi]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build documentation
        run: uv run --frozen --group docs zensical build --clean
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  publish-release:
    name: Publish GitHub Release
    needs: [check-tag, release-assets, pypi, docs]
    if: success() && needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
