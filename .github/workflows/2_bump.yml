name: Tag prepared release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-operations
  cancel-in-progress: false

jobs:
  release:
    name: Tag prepared version and release
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-operations
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Validate prepared release
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv lock --check
          VERSION=$(python scripts/release_artifacts.py version)
          tag_exists=false
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Version $VERSION is already tagged at a different release point."
              exit 1
            fi
            tag_exists=true
          fi
          latest_version=$(git tag --list --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && latest == "" {latest=$0} END {print latest}')
          if [ -n "$latest_version" ]; then
            version_args=(python scripts/release_artifacts.py version --latest-tag "$latest_version")
            if [ "$tag_exists" = "true" ]; then
              version_args+=(--resume)
            fi
            "${version_args[@]}" >/dev/null
          fi

          draft_output=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .tag_name')
          drafts=()
          if [ -n "$draft_output" ]; then
            mapfile -t drafts <<< "$draft_output"
          fi
          for draft in "${drafts[@]}"; do
            if [ "$tag_exists" != "true" ] || [ "$draft" != "$VERSION" ]; then
              echo "::error::Draft release $draft must finish before another release starts."
              exit 1
            fi
          done
          if grep -q '^## Unreleased' CHANGELOG.md; then
            echo "::error::Release commit must contain a finalized CHANGELOG without an Unreleased section."
            exit 1
          fi
          first_release=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+ \(/ {print $2; exit}' CHANGELOG.md)
          if [ "$first_release" != "$VERSION" ]; then
            echo "::error::The first CHANGELOG release ($first_release) does not match $VERSION."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Release must tag an already-prepared clean commit."
            git status --short
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          awk '/^## [0-9]+\\.[0-9]+\\.[0-9]+ / {if(d) exit; d=1; next} d && /^## / {exit} d {print}' CHANGELOG.md > release_body.md
          if ! grep -q '[^[:space:]]' release_body.md; then
            echo "::error::Release notes for the first CHANGELOG entry are empty."
            exit 1
          fi

      - name: Push the exact branch and tag
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            git tag "$VERSION"
          fi
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic "$remote" "HEAD:refs/heads/$BRANCH" "refs/tags/$VERSION:refs/tags/$VERSION"

      - name: Create draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$VERSION" --repo "$GH_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::GitHub release $VERSION is already published."
              exit 1
            fi
          else
            gh release create "$VERSION" --repo "$GH_REPO" --verify-tag --draft --title "$VERSION" --notes-file release_body.md
          fi

      - name: Run Tests for the prepared commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run 1_test.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
