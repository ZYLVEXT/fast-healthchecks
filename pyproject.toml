[project]
name = "fast-healthchecks"
version = "1.1.2"
description = "Fast Healthchecks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vladislav Shepilov", email = "shepilov.v@protonmail.com"},
]
maintainers = [
    {name = "Vladislav Shepilov", email = "shepilov.v@protonmail.com"},
]
keywords = [
    "healthcheck", "library",
    "fastapi", "starlette", "faststream", "litestar",
    "asyncpg", "psycopg", "redis", "aio-pika", "httpx", "aiokafka", "motor",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = "<3.15.0,>=3.10.0"
dependencies = []

[project.urls]
homepage = "https://github.com/ZYLVEXT/fast-healthchecks"
documentation = "https://zylvext.github.io/fast-healthchecks/"
source = "https://github.com/ZYLVEXT/fast-healthchecks"
tracker = "https://github.com/ZYLVEXT/fast-healthchecks/issues"

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.31.0,<1.0.0"]
psycopg = ["psycopg[binary]>=3.3.3,<4.0.0"]
redis = ["redis>=7.3.0,<9.0.0"]
aio-pika = ["aio-pika>=9.6.1,<10.0.0"]
httpx = ["httpx>=0.28.1,<1.0.0"]
aiokafka = ["aiokafka>=0.13.0,<1.0.0"]
motor = ["motor>=3.7.1,<4.0.0"]
fastapi = ["fastapi[standard]>=0.135.1,<1.0.0"]
faststream = ["faststream>=0.6.7,<1.0.0"]
litestar = ["litestar>=2.21.1,<3.0.0"]
opensearch = ["opensearch-py[async]>=3.1.0,<4.0.0"]

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "pip-audit>=2.10.1",
    "prek>=0.4.12",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-deadfixtures>=3.1.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3,<7.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "httpx2>=2.9.1,<3.0.0",
    "ruff>=0.16.2",
    "rust-just>=1.58.0",
    "ty>=0.0.69",
    "tomli>=2.4.1; python_version < '3.11'",
    "deptry>=0.25.1",
]
docs = [
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
    "zensical>=0.0.53",
]

[tool.ty.environment]
# Match project.requires-python minimum for type-checking.
python-version = "3.10"

[tool.ty.src]
include = ["fast_healthchecks", "tests"]

[tool.deptry]
experimental_namespace_package = true

[tool.deptry.per_rule_ignores]
# dotenv is used by examples; tomli and PyYAML are used by repository-only release scripts.
DEP004 = ["dotenv", "tomli", "yaml"]
# tomllib is part of the standard library on Python 3.11+ and has a guarded tomli fallback on 3.10.
DEP001 = ["tomllib"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
# Assume Python 3.10 to be compatible with typing.
target-version = "py310"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    ".tox",
    "docs",  # Preserve Zensical/PyMdown include directives inside Python code fences.
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "line-too-long",  # line length is handled by ruff-format
    "missing-copyright-notice",  # copyright headers are not required
    "missing-trailing-comma",  # conflicts with ruff-format
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "unused-function-argument",
    "invalid-function-name",
    "non-lowercase-variable-in-function",
    "S",
    "SLF",
]

[tool.pytest.ini_options]
# 60s so integration tests (network I/O, e.g. OpenSearch to invalid host) don't get killed on Windows
# where pytest-timeout uses thread method and can crash the worker when timeout fires
timeout = 60
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
minversion = "9.0"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "error",
    "error:::fast_healthchecks",
]
markers = """
    imports: mark a test as an imports test
    integration: mark a test as an integration test
    unit: mark a test as a unit test
"""

[tool.coverage.run]
source = ["fast_healthchecks"]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.report]
precision = 1
fail_under = 100
include = ["fast_healthchecks/*"]
omit = [
    "tests/*",
]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't check obviously not implemented
    "raise NotImplementedError",
    # We don't really care what happens if fail
    "except ImportError:",
    # Don't check for typing-only code
    "if TYPE_CHECKING:",
    "^\\s*@overload\\b",
    "@(typing\\.)?overload",
    "^\\s*\\.\\.\\.\\s*$",
    "^\\s*class \\w+(\\[.*\\])?\\(.*Protocol\\b.*\\):",
    "^\\s*type \\w+\\s*=",
    # Don't check for code that only runs itself
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = false
major_version_zero = false
version_files = [
    "pyproject.toml:version",
    "fast_healthchecks/__init__.py:__version__",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fast_healthchecks"]
artifacts = ["fast_healthchecks/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/fast_healthchecks",
    "/pyproject.toml",
    "/scripts",
    "/tests",
    "/zensical.toml",
]
